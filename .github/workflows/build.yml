name: build-site

# Builds the site from the sources (content/, tools/, assets/) and publishes it with GitHub Pages.
# The built pages (_site/) are NOT committed to the repository.
# Requires: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'tools/**'
      - 'assets/**'
      - 'robots.txt'
      - '.github/workflows/build.yml'
  # Also started by publish-from-issue after it saves a post (pushes made by workflows do not trigger this file).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        run: node --test tools/test.mjs
      - name: Build pages into _site
        run: node tools/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
