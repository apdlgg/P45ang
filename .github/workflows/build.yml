name: build-site

# When files under content/ or the site files change, build the pages and commit them.
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'tools/**'
      - 'assets/**'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build pages
        run: node tools/build.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "p45ang-build"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "build: generate pages"
            git push
          else
            echo "no changes"
          fi
