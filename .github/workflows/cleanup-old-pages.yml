name: cleanup-old-pages

# One-time cleanup after switching Pages to "GitHub Actions".
# Removes the pages that the old setup used to commit into the repository (they are now built into _site/ on every deploy).
# Only generated files are removed. Nothing under content/, tools/, assets/landscapes/ or .github/ is touched.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Delete the files (off = only list what would be deleted)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that Pages is deployed by GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "Pages build type: $type"
          if [ "$type" != "workflow" ]; then
            echo "::error::Pages is not using GitHub Actions yet (Settings -> Pages -> Source: GitHub Actions). Nothing was deleted."
            exit 1
          fi
      - name: Remove old generated pages
        env:
          APPLY: ${{ inputs.apply }}
        run: |
          MARK='generated by tools/build.mjs'
          list=$(mktemp)
          # Pages the old build wrote (every one carries the generator mark).
          # 404 and about pages were hand-made in the old setup; they now come from tools/templates and content/profile.json.
          for f in 404.html about/index.html; do
            [ -f "$f" ] && echo "$f" >> "$list"
          done
          [ -f archive/index.html ] && grep -q "$MARK" archive/index.html && echo archive/index.html >> "$list"
          for f in posts/*/index.html categories/*/index.html; do
            [ -f "$f" ] && grep -q "$MARK" "$f" && echo "$(dirname "$f")" >> "$list"
          done
          # The old home page (hand-made shell with build markers) and other old build outputs.
          [ -f index.html ] && grep -q '<!--build:records-list-->' index.html && echo index.html >> "$list"
          for f in feed.xml sitemap.xml .nojekyll assets/search-index.js assets/security-news.js assets/style.css assets/preview.css; do
            [ -e "$f" ] && echo "$f" >> "$list"
          done
          echo "### Old generated files" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/- /' "$list" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -s "$list" ]; then echo "Nothing to remove." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          if [ "$APPLY" != "true" ]; then echo "Preview only. Run again with apply on to delete." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          xargs git rm -r -q -- < "$list"
          git -c user.name="p45ang-build" -c user.email="actions@users.noreply.github.com" commit -qm "cleanup: remove pages generated by the old setup"
          git push
          echo "Deleted." >> "$GITHUB_STEP_SUMMARY"
