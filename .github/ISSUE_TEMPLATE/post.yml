name: 새 글
description: 학습 기록 글을 올립니다 (저장소 소유자·협업자만 사이트에 반영됩니다)
title: "[글] "
labels: ["글"]
body:
  - type: input
    id: title
    attributes:
      label: 제목
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 분야
      options:
        - 개발
        - CTF/Wargame
        - Bug Bounty
        - 블로그/기술문서
        - 논문/컨퍼런스
        - 공모전/자격증
    validations:
      required: true
  - type: input
    id: summary
    attributes:
      label: 요약
      description: 목록과 검색에 보이는 한두 줄입니다. 비우면 본문 앞부분이 쓰입니다.
  - type: input
    id: tags
    attributes:
      label: 태그
      description: "쉼표로 구분합니다. 예: XSS, 웹보안"
  - type: input
    id: slug
    attributes:
      label: 주소 이름
      description: 선택. 영어 소문자·숫자·하이픈만 (예 xss-filter-bypass). 비우면 자동으로 정해집니다.
  - type: textarea
    id: content
    attributes:
      label: 본문
      description: |
        ## 큰 제목, ### 작은 제목, **굵게**, `코드` 처럼 마크다운을 쓸 수 있고, 모르면 그냥 글만 적어도 됩니다.
        이미지는 이 칸에 끌어다 놓거나 붙여 넣으세요. 첫 이미지가 목록 썸네일이 됩니다.
    validations:
      required: true
